<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com; frame-src 'self' https://*.firebaseapp.com;">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Church Information</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060402">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#060402;overflow-y:auto;overflow-x:hidden;font-family:Georgia,serif;}

.stage{position:relative;width:100%;max-width:480px;margin:0 auto;aspect-ratio:1024/1536;}
.stage img.bg{width:100%;height:100%;display:block;object-fit:fill;}

.hit{position:absolute;background:transparent;border:none;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.hit:focus-visible, .eye-toggle:focus-visible { outline: 2px solid #c9a15a !important; border-radius: 4px; z-index: 10; }
input.hit{color:#e8c876;font-size:clamp(11px,2.5vw,15px);outline:none;font-family:Georgia,serif;
  line-height:1;display:flex;align-items:center;background:transparent;z-index:3;}
input.hit::placeholder{color:transparent;}
input.hit:focus::placeholder{color:transparent;}

.mask{position:absolute;border-radius:6px;z-index:2;}

.b-back2   { left:3.5%; top:2.4%;  width:6.5%; height:2.6%; }
.m-cname   { left:19%; top:38.1%; width:65%; height:2.9%; background:#101111; }
.f-cname   { left:22%; top:38.3%; width:60%; height:2.6%; }
.b-cphoto  { left:6%;  top:42.3%; width:88%; height:8.3%; }
.m-cloc    { left:19%; top:56.2%; width:65%; height:2.9%; background:#111212; }
.f-cloc    { left:22%; top:56.4%; width:60%; height:2.6%; }
.m-cinsta  { left:19%; top:65.0%; width:65%; height:2.9%; background:#111212; }
.f-cinsta  { left:22%; top:65.2%; width:60%; height:2.6%; }
.m-cyt     { left:19%; top:73.8%; width:65%; height:2.9%; background:#101212; }
.f-cyt     { left:22%; top:74.0%; width:60%; height:2.6%; }
.m-cweb    { left:19%; top:82.6%; width:65%; height:2.9%; background:#101111; }
.f-cweb    { left:22%; top:82.8%; width:60%; height:2.6%; }
.b-continue2{ left:8%; top:92.1%; width:84%; height:5.3%; }

.photo-preview{position:absolute;left:9.5%;top:43.8%;width:8.5%;height:6.8%;border-radius:8px;
  object-fit:cover;display:none;z-index:5;}

.msg-box{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:rgba(20,12,4,0.95);border:1px solid #a5772a;color:#f0ddb0;
  padding:10px 18px;border-radius:20px;font-size:0.85rem;display:none;z-index:999;max-width:90%;text-align:center;}
</style>
</head>
<body>

<div class="msg-box" id="msgBox" role="alert" aria-live="assertive"></div>

<div class="stage" id="churchScreen2">
  <!-- ⚡ Bolt: Replaced 2.2MB inline base64 image with external reference to improve parsing and load times -->
  <img class="bg" id="churchImg" src="images/church-bg.png" alt="Church Information">
  <button class="hit b-back2" onclick="history.back()" aria-label="Back"></button>

  <div class="mask m-cname"></div>
  <input class="hit f-cname" id="churchName" type="text" maxlength="100" placeholder="Enter your church name" aria-label="Church Name" onkeydown="if(event.key === 'Enter') handleContinue()">

  <button class="hit b-cphoto" onclick="document.getElementById('churchPhotoFile').click()" aria-label="Upload church photo"></button>
  <input type="file" id="churchPhotoFile" accept="image/*" style="display:none" onchange="previewChurchPhoto(this)">
  <img class="photo-preview" id="churchPhotoPreview" src="" alt="Church Photo Preview">

  <div class="mask m-cloc"></div>
  <input class="hit f-cloc" id="churchLoc" type="text" maxlength="100" placeholder="Search your church location" aria-label="Church Location" onkeydown="if(event.key === 'Enter') handleContinue()">

  <div class="mask m-cinsta"></div>
  <input class="hit f-cinsta" id="churchInsta" type="text" maxlength="100" placeholder="e.g. @yourchurch" aria-label="Instagram Handle" onkeydown="if(event.key === 'Enter') handleContinue()">

  <div class="mask m-cyt"></div>
  <input class="hit f-cyt" id="churchYT" type="text" maxlength="100" placeholder="e.g. Your Church Channel" aria-label="YouTube Channel" onkeydown="if(event.key === 'Enter') handleContinue()">

  <div class="mask m-cweb"></div>
  <input class="hit f-cweb" id="churchWeb" type="text" maxlength="100" placeholder="e.g. www.yourchurch.org" aria-label="Website" onkeydown="if(event.key === 'Enter') handleContinue()">

  <button class="hit b-continue2" onclick="handleContinue()" aria-label="Continue"></button>
</div>

<script type="module">
import { previewChurchPhotoHandler } from "./utils.js";
window.previewChurchPhotoHandler = previewChurchPhotoHandler;
</script>
<script>
function showMsg(text, ms=3000){
  const box = document.getElementById('msgBox');
  box.textContent = text;
  box.style.display = 'block';
  clearTimeout(window._msgTimer);
  window._msgTimer = setTimeout(()=>{ box.style.display='none'; }, ms);
}

function previewChurchPhoto(input) {
  if (window.previewChurchPhotoHandler) {
    window.previewChurchPhotoHandler(input, showMsg);
  } else {
    setTimeout(() => previewChurchPhoto(input), 100);
  }
}

function handleContinue(){
  const churchName = document.getElementById('churchName').value.trim();
  const loc = document.getElementById('churchLoc').value.trim();
  const insta = document.getElementById('churchInsta').value.trim();
  const yt = document.getElementById('churchYT').value.trim();
  const web = document.getElementById('churchWeb').value.trim();

  if(!churchName){ showMsg('⚠️ Church Name தேவை'); return; }

  const data = {
    churchName, location: loc, instagram: insta, youtube: yt, website: web,
    hasPhoto: !!window._churchPhotoDataUrl,
    photoDataUrl: window._churchPhotoDataUrl || null
  };
  console.log('Church Info collected:', data);
  showMsg('✅ Collected: ' + churchName + (loc ? ' | ' + loc : ''));
  // TODO: connect this to your backend / next screen navigation here
}
</script>
</body>
</html>
